<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Golden Frame — 3D Photo Gallery</title>
  <style>
    :root {
      --bg: #09070d;
      --gold: #f6c85f;
      --gold2: #fff0a8;
      --pink: #ff5da2;
      --text: #fff8e8;
      --muted: #b9afbd;
      --card: #15111d;
    }
    * { box-sizing: border-box }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; color: var(--text) }
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(255,193,70,.12), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(255,60,150,.11), transparent 28%),
        linear-gradient(135deg, #07060b, #120b16 55%, #08070d);
      overflow-x: hidden;
    }
    button { font: inherit }
    .app { max-width: 1400px; margin: auto; padding: 42px 24px 70px }
    header { text-align: center; margin-bottom: 34px }
    .badge {
      display: inline-flex; padding: 7px 12px; border: 1px solid rgba(246,200,95,.35); border-radius: 999px;
      color: #ffe8a0; background: rgba(246,200,95,.07); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    }
    h1 { font-size: clamp(32px, 5vw, 64px); margin: 15px 0 8px; line-height: 1.02 }
    h1 span { background: linear-gradient(90deg, #fff, var(--gold), #ff9ac8); -webkit-background-clip: text; background-clip: text; color: transparent }
    .subtitle { color: var(--muted); max-width: 650px; margin: auto; line-height: 1.6 }
    .toolbar {
      display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap;
      margin: 28px 0 32px;
    }
    #fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none }
    .upload {
      display: inline-flex; align-items: center; justify-content: center; border: 0; cursor: pointer;
      color: #17100a; font-weight: 800; padding: 13px 20px; border-radius: 14px;
      background: linear-gradient(135deg, #fff1a8, #f2b83f);
      box-shadow: 0 0 30px rgba(246,200,95,.18);
      transition: .25s transform, .25s box-shadow;
    }
    .upload:hover { transform: translateY(-2px); box-shadow: 0 0 38px rgba(246,200,95,.35) }
    .counter { color: #d8cfda; padding: 11px 15px; border: 1px solid #332a39; border-radius: 14px; background: #120e17 }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px }
    .card {
      position: relative; aspect-ratio: 4/3; border-radius: 18px; overflow: hidden;
      background: var(--card); border: 1px solid #302638; cursor: pointer;
      transition: transform .3s, box-shadow .3s, border-color .3s;
    }
    .card:hover {
      transform: translateY(-7px) scale(1.025);
      border-color: rgba(246,200,95,.65);
      box-shadow: 0 18px 45px rgba(0,0,0,.5), 0 0 28px rgba(246,200,95,.13);
    }
    .card img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .5s }
    .card:hover img { transform: scale(1.06) }
    .card:after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(transparent 55%, rgba(0,0,0,.6));
      pointer-events: none;
    }
    .delete {
      position: absolute; z-index: 3; right: 10px; top: 10px; width: 34px; height: 34px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 50%;
      background: rgba(0,0,0,.58); color: white; cursor: pointer;
      opacity: 0; transform: scale(.8); transition: .2s;
    }
    .card:hover .delete { opacity: 1; transform: scale(1) }
    .delete:hover { background: #d92f66 }
    .empty {
      grid-column: 1/-1; text-align: center; padding: 70px 20px;
      border: 1px dashed #3b3043; border-radius: 24px; color: #aaa0ad;
    }
    .empty strong { display: block; color: #f3d98c; font-size: 20px; margin-bottom: 7px }

    /* модальное окно */
    .modal {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center; padding: 24px;
      background: rgba(4,2,8,.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0; visibility: hidden;
      transition: opacity .3s, visibility .3s;
    }
    .modal.open { opacity: 1; visibility: visible }
    .stage {
      position: relative;
      width: min(86vw, 820px);
      height: min(78vh, 650px);
      display: grid; place-items: center;
      perspective: 1300px;
    }
    .frame {
      position: relative;
      width: min(78vw, 700px);
      height: min(68vh, 560px);
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6d4a13, #ffeaa0 20%, #a86c16 42%, #fff1a1 58%, #70470e 80%, #ffd86a);
      box-shadow: 0 0 0 2px rgba(255,225,130,.4), 0 30px 80px rgba(0,0,0,.7);
      transform: scale(.3) rotateX(28deg) rotateY(-20deg) rotateZ(-5deg);
      opacity: 0;
      transition: transform .85s cubic-bezier(.17,.89,.32,1.25), opacity .35s;
    }
    .open .frame {
      transform: scale(1) rotateX(0) rotateY(0) rotateZ(0);
      opacity: 1;
    }
    .frame:before {
      content: "";
      position: absolute; inset: -5px; border-radius: 24px; z-index: -1;
      background: conic-gradient(from 0deg, #6b4208, #fff0a0, #d9941a, #fff7bd, #7a4c09, #ffe27b, #6b4208);
      animation: spinBorder 4s linear infinite;
      filter: drop-shadow(0 0 13px rgba(255,207,79,.8));
    }
    .frame:after {
      content: "";
      position: absolute; inset: 0; border-radius: 15px; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.42) 48%, rgba(255,236,170,.1) 53%, transparent 64%);
      transform: translateX(-130%);
      animation: shine 2.8s 1s ease-in-out infinite;
    }
    .photo-wrap {
      width: 100%; height: 100%; overflow: hidden; border-radius: 7px;
      background: #08070a; position: relative;
    }
    .photo-wrap:after {
      content: ""; position: absolute; inset: 0;
      box-shadow: inset 0 0 55px rgba(0,0,0,.55);
      pointer-events: none;
    }
    .modal-photo {
      width: 100%; height: 100%; display: block; object-fit: contain;
      cursor: pointer;
      transform-style: preserve-3d;
      animation: photo3d 8s linear infinite;
    }
    .modal-photo.paused { animation-play-state: paused }
    .corner {
      position: absolute; width: 55px; height: 55px; z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 9px #ffd96c);
      transition: opacity .35s .5s, transform .5s .5s;
    }
    .open .corner { opacity: 1; transform: none }
    .c1 { left: -7px; top: -7px; border-left: 5px solid #ffe889; border-top: 5px solid #ffe889; border-radius: 16px 0 0 }
    .c2 { right: -7px; top: -7px; border-right: 5px solid #ffe889; border-top: 5px solid #ffe889; border-radius: 0 16px 0 0 }
    .c3 { left: -7px; bottom: -7px; border-left: 5px solid #ffe889; border-bottom: 5px solid #ffe889; border-radius: 0 0 0 16px }
    .c4 { right: -7px; bottom: -7px; border-right: 5px solid #ffe889; border-bottom: 5px solid #ffe889; border-radius: 0 0 16px 0 }
    .flash {
      position: absolute; width: 30px; height: 30px; border-radius: 50%;
      background: #fff5ad; box-shadow: 0 0 30px 12px #ffd75d;
      opacity: 0; z-index: 5; pointer-events: none;
    }
    .open .flash { animation: flash .9s ease-out .45s }
    .close {
      position: absolute; right: 0; top: -45px; width: 40px; height: 40px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
      background: rgba(10,7,13,.7); color: #fff; font-size: 25px;
      cursor: pointer; z-index: 10;
    }
    .hint {
      position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%);
      color: #c8becb; font-size: 13px; white-space: nowrap;
    }
    .particle {
      position: absolute; left: 50%; top: 50%;
      width: var(--s); height: var(--s);
      border-radius: 50%; background: var(--c);
      box-shadow: 0 0 9px var(--c);
      pointer-events: none;
      animation: particle var(--d) cubic-bezier(.12,.7,.25,1) var(--delay) forwards;
    }

    /* анимации */
    @keyframes spinBorder { to { transform: rotate(360deg) } }
    @keyframes shine {
      0%, 25% { transform: translateX(-130%) }
      70%, 100% { transform: translateX(130%) }
    }
    @keyframes photo3d {
      0% { transform: rotateY(-9deg) }
      50% { transform: rotateY(9deg) }
      100% { transform: rotateY(-9deg) }
    }
    @keyframes flash {
      0% { opacity: 1; transform: scale(.2) }
      70% { opacity: .5 }
      100% { opacity: 0; transform: scale(18) }
    }
    @keyframes particle {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(.3) }
      70% { opacity: 1 }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.05) }
    }

    /* адаптив */
    @media (max-width: 600px) {
      .app { padding: 28px 14px 50px }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px }
      .frame { padding: 10px }
      .hint { font-size: 11px }
      .close { right: -2px; top: -48px }
      .stage { width: 92vw }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="badge">3D Photo Experience</div>
    <h1>Golden <span>Gallery</span></h1>
    <p class="subtitle">Загружайте фотографии и открывайте их в премиальной 3D-рамке с золотым свечением, бликами и фейерверком частиц.</p>
  </header>
  <div class="toolbar">
    <input id="fileInput" type="file" accept="image/*" multiple>
    <label class="upload" id="uploadBtn" for="fileInput">＋ Загрузить фото</label>
    <div class="counter">Фотографий: <b id="count">0</b></div>
  </div>
  <section class="gallery" id="gallery">
    <div class="empty" id="empty"><strong>Галерея пока пуста</strong>Нажмите «Загрузить фото», чтобы добавить изображения.</div>
  </section>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="stage" id="stage">
    <button class="close" id="closeBtn" aria-label="Закрыть">×</button>
    <div class="frame" id="frame">
      <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
      <div class="flash"></div>
      <div class="photo-wrap"><img class="modal-photo" id="modalPhoto" alt=""></div>
    </div>
    <div class="hint">Клик по фото — пауза / продолжить 3D-вращение</div>
  </div>
</div>

<script>
  const state = { photos: [], activeId: null, rotating: true };
  const fileInput = document.getElementById('fileInput');
  const gallery = document.getElementById('gallery');
  const count = document.getElementById('count');
  const empty = document.getElementById('empty');
  const modal = document.getElementById('modal');
  const modalPhoto = document.getElementById('modalPhoto');
  const closeBtn = document.getElementById('closeBtn');
  const stage = document.getElementById('stage');

  fileInput.addEventListener('change', function(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    files.forEach(file => {
      if (!file.type || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        state.photos.push({
          id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random(),
          src: ev.target.result,
          name: file.name
        });
        render();
      };
      reader.onerror = function() { alert('Не удалось прочитать файл: ' + file.name); };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  function render() {
    gallery.querySelectorAll('.card').forEach(x => x.remove());
    empty.style.display = state.photos.length ? 'none' : 'block';
    count.textContent = state.photos.length;
    state.photos.forEach(p => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.id = p.id;
      const img = document.createElement('img');
      img.src = p.src;
      img.alt = p.name;
      const del = document.createElement('button');
      del.className = 'delete';
      del.innerHTML = '×';
      del.title = 'Удалить';
      del.onclick = e => { e.stopPropagation(); removePhoto(p.id); };
      card.onclick = () => openModal(p.id);
      card.append(img, del);
      gallery.append(card);
    });
  }

  function removePhoto(id) {
    if (state.activeId === id) closeModal();
    state.photos = state.photos.filter(p => p.id !== id);
    render();
  }

  function openModal(id) {
    const p = state.photos.find(x => x.id === id);
    if (!p) return;
    state.activeId = id;
    state.rotating = true;
    modalPhoto.src = p.src;
    modalPhoto.alt = p.name;
    modalPhoto.classList.remove('paused');
    createParticles(140);
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    state.activeId = null;
    modalPhoto.classList.remove('paused');
    modalPhoto.removeAttribute('src');
    document.querySelectorAll('.particle').forEach(p => p.remove());
    document.body.style.overflow = '';
  }

  modalPhoto.onclick = () => {
    state.rotating = !state.rotating;
    modalPhoto.classList.toggle('paused', !state.rotating);
  };

  closeBtn.onclick = closeModal;
  modal.onclick = e => { if (e.target === modal) closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  function createParticles(n) {
    document.querySelectorAll('.particle').forEach(p => p.remove());
    const colors = ['#ffd65a','#fff3a5','#ff6cae','#7ee7ff','#c69cff','#ffffff','#ff8c42'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      const a = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 360;
      p.style.setProperty('--x', Math.cos(a) * dist + 'px');
      p.style.setProperty('--y', Math.sin(a) * dist + 'px');
      p.style.setProperty('--s', 2 + Math.random() * 5 + 'px');
      p.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
      p.style.setProperty('--d', .7 + Math.random() * 1.5 + 's');
      p.style.setProperty('--delay', Math.random() * .35 + 's');
      stage.appendChild(p);
    }
  }

  render();
</script>
</body>
</html>
