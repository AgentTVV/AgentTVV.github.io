<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartsVault — каталог деталей</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1115;color:#e9edf3}
    button,input,textarea{font:inherit}button{cursor:pointer}
    .app{min-height:100vh}.top{height:64px;border-bottom:1px solid #292e38;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#151820}
    .logo{font-weight:800;font-size:20px}.logo span{color:#65a8ff}.user{display:flex;gap:10px;align-items:center;color:#aeb7c5}
    .layout{display:flex;min-height:calc(100vh - 64px)}.side{width:250px;border-right:1px solid #292e38;padding:18px;background:#13161c}
    .side button{width:100%;margin-bottom:8px;padding:11px;border:1px solid #303643;background:#1b2029;color:#dfe6ef;border-radius:9px;text-align:left}
    .side button.active{background:#2469c8;border-color:#3982e6;color:white}
    .main{flex:1;padding:28px;max-width:1200px}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}
    h1{margin:0 0 6px;font-size:28px}h2{font-size:18px;margin:0 0 14px}.muted{color:#8e99a9}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
    .card{background:#171b23;border:1px solid #2a303b;border-radius:13px;padding:17px}.card:hover{border-color:#3b4657}
    .card h3{margin:0 0 7px;font-size:17px}.meta{font-size:13px;color:#8994a4}
    .badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#253247;color:#9bc7ff}.private{background:#35282a;color:#ffb0b0}
    .primary{background:#2d78dc!important;border-color:#3989f1!important;color:#fff!important}.danger{background:#48262b!important;border-color:#68343b!important;color:#ffb6bd!important}
    .btn{padding:9px 12px;border:1px solid #303743;border-radius:8px;background:#1b2029;color:#e8edf5}
    input,textarea{width:100%;background:#101319;color:#edf2f8;border:1px solid #333a47;border-radius:8px;padding:10px;outline:none}
    textarea{min-height:120px;resize:vertical}.form{display:grid;gap:12px}.field label{display:block;font-size:13px;color:#9ca7b6;margin-bottom:6px}
    .modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{width:min(520px,100%);background:#181c24;border:1px solid #303744;border-radius:14px;padding:20px}
    .hidden{display:none!important}.files{display:grid;gap:9px;margin-top:16px}.file{padding:14px;background:#171b23;border:1px solid #2b313d;border-radius:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .empty{padding:50px;text-align:center;border:1px dashed #343b48;border-radius:13px;color:#8e99a9;margin-top:20px}
    .search{max-width:340px}.share{font-size:12px;word-break:break-all;color:#74b0ff}
    .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:min(420px,100%);background:#171b23;border:1px solid #2d3440;border-radius:16px;padding:25px}.authbox h1{margin-bottom:20px}
    .notice{padding:12px;border-radius:9px;background:#202735;color:#b8c9df;font-size:13px;margin-bottom:14px}
    @media(max-width:700px){.side{width:190px}.main{padding:18px}.top{padding:0 14px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
  const KEY = 'partsvault_demo_v1';
  let db = JSON.parse(localStorage.getItem(KEY) || 'null') || { users: [], folders: [], files: [], session: null };
  const save = () => localStorage.setItem(KEY, JSON.stringify(db));
  const id = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const user = () => db.users.find(x => x.id === db.session);

  // Экранирование для защиты от XSS
  function esc(s = '') {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function render() {
    user() ? renderApp() : renderAuth();
  }

  function renderAuth() {
    root.innerHTML = `
      <div class="auth">
        <div class="authbox">
          <div class="logo">Parts<span>Vault</span></div>
          <h1 style="margin-top:12px">Вход / регистрация</h1>
          <div class="notice">Демо-версия: данные хранятся только в браузере. Для настоящего сайта нужна серверная база данных и авторизация.</div>
          <div class="form">
            <div class="field"><label>Имя пользователя</label><input id="login" placeholder="например, nikita"></div>
            <div class="field"><label>Пароль</label><input id="pass" type="password" placeholder="••••••••"></div>
            <div class="row">
              <button class="btn primary" onclick="login()">Войти</button>
              <button class="btn" onclick="register()">Создать аккаунт</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function login() {
    let l = document.getElementById('login').value.trim();
    let p = document.getElementById('pass').value;
    let u = db.users.find(x => x.login === l);
    if (!u || u.pass !== p) return alert('Неверный логин или пароль');
    db.session = u.id;
    save();
    render();
  }

  function register() {
    let l = document.getElementById('login').value.trim();
    let p = document.getElementById('pass').value;
    if (!l || !p) return alert('Заполните поля');
    if (db.users.some(x => x.login === l)) return alert('Такой пользователь уже существует');
    let u = { id: id(), login: l, pass: p };
    db.users.push(u);
    db.session = u.id;
    save();
    render();
  }

  function renderApp() {
    root.innerHTML = `
      <div class="app">
        <header class="top">
          <div class="logo">Parts<span>Vault</span></div>
          <div class="user">👤 ${esc(user().login)} <button class="btn" onclick="logout()">Выйти</button></div>
        </header>
        <div class="layout">
          <aside class="side">
            <button class="active" onclick="showFolders()">📁 Мои папки</button>
            <button onclick="newFolder()">＋ Новая папка</button>
            <button onclick="showPublic()">🌐 Открытые папки</button>
          </aside>
          <main class="main" id="main"></main>
        </div>
      </div>
    `;
    showFolders();
  }

  function showFolders() {
    const main = document.getElementById('main');
    const folders = db.folders.filter(f => f.owner === user().id);
    main.innerHTML = `
      <div class="row between">
        <div><h1>Мои папки</h1><div class="muted">Каталог деталей и кодов</div></div>
        <button class="btn primary" onclick="newFolder()">＋ Создать папку</button>
      </div>
      <div class="grid">
        ${folders.map(f => folderCard(f)).join('') ||
          '<div class="empty" style="grid-column:1/-1">Папок пока нет.<br>Создайте первую папку для деталей.</div>'}
      </div>
    `;
  }

  function folderCard(f) {
    const n = db.files.filter(x => x.folder === f.id).length;
    return `
      <div class="card">
        <div class="row between">
          <h3>📁 ${esc(f.name)}</h3>
          <span class="badge ${f.public ? '' : 'private'}">${f.public ? 'Открытая' : 'Закрытая'}</span>
        </div>
        <div class="meta">${n} файл(ов)</div>
        <div class="row" style="margin-top:15px">
          <button class="btn primary" onclick="openFolder('${f.id}')">Открыть</button>
          <button class="btn" onclick="editFolder('${f.id}')">Настройки</button>
        </div>
      </div>
    `;
  }

  function newFolder() {
    modal(`
      <h2>Новая папка</h2>
      <div class="form">
        <div class="field"><label>Название</label><input id="fname" placeholder="Например: Фрезы"></div>
        <label><input id="fpub" type="checkbox" style="width:auto"> Сделать папку открытой</label>
        <button class="btn primary" onclick="createFolder()">Создать</button>
      </div>
    `);
  }

  function createFolder() {
    const name = document.getElementById('fname').value.trim();
    if (!name) return alert('Введите название');
    db.folders.push({ id: id(), owner: user().id, name, public: document.getElementById('fpub').checked });
    save();
    closeModal();
    showFolders();
  }

  function editFolder(fid) {
    const f = db.folders.find(x => x.id === fid);
    if (!f) return alert('Папка не найдена');
    modal(`
      <h2>Настройки папки</h2>
      <div class="form">
        <div class="field"><label>Название</label><input id="fname" value="${esc(f.name)}"></div>
        <label><input id="fpub" type="checkbox" ${f.public ? 'checked' : ''} style="width:auto"> Открытый доступ</label>
        <div class="share">Ссылка: ${location.href.split('#')[0]}#folder=${f.id}</div>
        <div class="row">
          <button class="btn primary" onclick="updateFolder('${f.id}')">Сохранить</button>
          <button class="btn danger" onclick="deleteFolder('${f.id}')">Удалить</button>
        </div>
      </div>
    `);
  }

  function updateFolder(fid) {
    const f = db.folders.find(x => x.id === fid);
    if (!f) return alert('Папка не найдена');
    const name = document.getElementById('fname').value.trim();
    if (name) f.name = name;
    f.public = document.getElementById('fpub').checked;
    save();
    closeModal();
    showFolders();
  }

  function deleteFolder(fid) {
    if (!confirm('Удалить папку и все её файлы?')) return;
    db.folders = db.folders.filter(x => x.id !== fid);
    db.files = db.files.filter(x => x.folder !== fid);
    save();
    closeModal();
    showFolders();
  }

  function openFolder(fid) {
    const f = db.folders.find(x => x.id === fid);
    if (!f) return alert('Папка не найдена');
    const owner = f.owner === user().id;
    if (!owner && !f.public) return alert('Эта папка закрыта');
    const files = db.files.filter(x => x.folder === fid);
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="row between">
        <div>
          <button class="btn" onclick="showFolders()">← Назад</button>
          <h1 style="margin-top:15px">📁 ${esc(f.name)}</h1>
          <div class="muted">${f.public ? 'Открытая папка' : 'Закрытая папка'} · ${files.length} файл(ов)</div>
        </div>
        ${owner ? `<button class="btn primary" onclick="newFile('${fid}')">＋ Добавить файл</button>` : ''}
      </div>
      <div class="files">
        ${files.map(x => fileRow(x, owner)).join('') || '<div class="empty">В этой папке пока нет файлов.</div>'}
      </div>
    `;
  }

  function fileRow(x, owner) {
    return `
      <div class="file">
        <div><b>📄 ${esc(x.name)}</b><div class="meta">Номер: ${esc(x.number)} · Код: ${esc(x.code)}</div></div>
        <div class="row">
          <button class="btn" onclick="downloadFile('${x.id}')">Скачать</button>
          ${owner ? `<button class="btn" onclick="editFile('${x.id}')">Изменить</button>` : ''}
        </div>
      </div>
    `;
  }

  function newFile(fid) {
    modal(`
      <h2>Новая деталь</h2>
      <div class="form">
        <div class="field"><label>Название детали</label><input id="dname" placeholder="Например: Корпус"></div>
        <div class="field"><label>Номер детали</label><input id="dnum" placeholder="123-456"></div>
        <div class="field"><label>Код</label><input id="dcode" placeholder="ABC-789"></div>
        <button class="btn primary" onclick="createFile('${fid}')">Создать файл</button>
      </div>
    `);
  }

  function createFile(fid) {
    const name = document.getElementById('dname').value.trim();
    const number = document.getElementById('dnum').value.trim();
    const code = document.getElementById('dcode').value.trim();
    if (!name || !number || !code) return alert('Заполните все поля');
    db.files.push({ id: id(), folder: fid, name, number, code });
    save();
    closeModal();
    openFolder(fid);
  }

  function editFile(idv) {
    const x = db.files.find(x => x.id === idv);
    if (!x) return alert('Файл не найден');
    modal(`
      <h2>Изменить деталь</h2>
      <div class="form">
        <div class="field"><label>Название</label><input id="dname" value="${esc(x.name)}"></div>
        <div class="field"><label>Номер</label><input id="dnum" value="${esc(x.number)}"></div>
        <div class="field"><label>Код</label><input id="dcode" value="${esc(x.code)}"></div>
        <div class="row">
          <button class="btn primary" onclick="updateFile('${x.id}')">Сохранить</button>
          <button class="btn danger" onclick="deleteFile('${x.id}')">Удалить</button>
        </div>
      </div>
    `);
  }

  function updateFile(idv) {
    const x = db.files.find(x => x.id === idv);
    if (!x) return alert('Файл не найден');
    x.name = document.getElementById('dname').value.trim() || x.name;
    x.number = document.getElementById('dnum').value.trim() || x.number;
    x.code = document.getElementById('dcode').value.trim() || x.code;
    save();
    closeModal();
    openFolder(x.folder);
  }

  function deleteFile(idv) {
    const x = db.files.find(x => x.id === idv);
    if (!x) return alert('Файл не найден');
    if (!confirm('Удалить файл?')) return;
    db.files = db.files.filter(y => y.id !== idv);
    save();
    closeModal();
    openFolder(x.folder);
  }

  function downloadFile(idv) {
    const x = db.files.find(x => x.id === idv);
    if (!x) return alert('Файл не найден');
    const text = `Название детали: ${x.name}\nНомер детали: ${x.number}\nКод: ${x.code}\n`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = `${x.name}_${x.number}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function showPublic() {
    const fs = db.folders.filter(f => f.public);
    const main = document.getElementById('main');
    main.innerHTML = `
      <div><h1>Открытые папки</h1><div class="muted">Папки, доступные другим пользователям</div></div>
      <div class="grid">
        ${fs.map(f => folderCardPublic(f)).join('') ||
          '<div class="empty" style="grid-column:1/-1">Открытых папок нет.</div>'}
      </div>
    `;
  }

  function folderCardPublic(f) {
    const n = db.files.filter(x => x.folder === f.id).length;
    const owner = db.users.find(u => u.id === f.owner);
    return `
      <div class="card">
        <h3>📁 ${esc(f.name)}</h3>
        <div class="meta">${n} файл(ов) · владелец: ${esc(owner?.login || '')}</div>
        <button class="btn primary" style="margin-top:15px" onclick="openFolder('${f.id}')">Просмотреть</button>
      </div>
    `;
  }

  function modal(content) {
    const d = document.createElement('div');
    d.id = 'modal';
    d.className = 'modal';
    d.innerHTML = `
      <div class="modalbox">
        <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">✕</button></div>
        ${content}
      </div>
    `;
    document.body.appendChild(d);
  }

  function closeModal() {
    document.getElementById('modal')?.remove();
  }

  function logout() {
    db.session = null;
    save();
    render();
  }

  render();
</script>
</body>
</html>
