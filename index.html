<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тактика ЛТ — помощник</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #14181e;
  --panel: #1e242d;
  --panel2: #262e3a;
  --border: #2f3a48;
  --text: #d8e0ea;
  --muted: #7a8697;
  --accent: #ff9c2b;
  --danger: #e5484d;
  --ok: #30a46c;
}
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-wrap: wrap;
}
.logo { font-weight: 700; font-size: 18px; color: var(--accent); white-space: nowrap; }
.search {
  flex: 1 1 200px;
  max-width: 400px;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.search:focus { border-color: var(--accent); }
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 600;
  transition: filter .15s, background .15s;
}
button:hover { filter: brightness(1.1); }
button:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #1a1000; }
.btn-ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

main { padding: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .thumb {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  display: block;
  background: #0b0e12;
}
.card .info {
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.card .name {
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.card .del {
  background: transparent;
  color: var(--muted);
  padding: 4px 8px;
  font-size: 16px;
  line-height: 1;
  border-radius: 6px;
  flex-shrink: 0;
}
.card .del:hover { color: var(--danger); background: rgba(229,72,77,.15); }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
  font-size: 15px;
  line-height: 1.7;
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  display: none;
  z-index: 100;
  padding: 16px;
  overflow-y: auto;
}
.modal-bg.open { display: block; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 1200px;
  margin: 0 auto;
  overflow: hidden;
}
.modal-head {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.modal-head input {
  flex: 1 1 180px;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.modal-head input:focus { border-color: var(--accent); }
.toolbar {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
  background: var(--panel2);
}
.tool {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
}
.tool.active { background: var(--accent); color: #1a1000; border-color: var(--accent); }
.tool-label { font-size: 12px; color: var(--muted); }
input[type="color"] {
  width: 38px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  cursor: pointer;
  padding: 2px;
}
input[type="range"] { width: 100px; accent-color: var(--accent); }
.canvas-wrap {
  padding: 16px;
  display: flex;
  justify-content: center;
  background: #0b0e12;
  overflow: auto;
}
canvas {
  max-width: 100%;
  max-height: calc(100vh - 260px);
  background: #333;
  border-radius: 6px;
  touch-action: none;
  cursor: crosshair;
  display: block;
}
.modal-foot {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.spacer { flex: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">🎯 ТАКТИКА ЛТ</div>
  <input type="search" class="search" id="search" placeholder="Поиск по названию карты...">
  <button class="btn-ghost" id="clearCache">🧹 Очистить кеш</button>
  <button class="btn-primary" id="addBtn">+ Добавить карту</button>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <input type="text" id="mapName" placeholder="Название карты (напр. Малиновка, Прохоровка)">
      <button class="btn-ghost btn-sm" id="editOther">📁 Сменить карту</button>
    </div>
    <div class="toolbar">
      <button class="tool active" data-tool="arrow">→ Стрелка</button>
      <button class="tool" data-tool="line">— Линия</button>
      <button class="tool" data-tool="pen">✎ Кисть</button>
      <div class="spacer"></div>
      <span class="tool-label">Цвет</span>
      <input type="color" id="color" value="#ff9c2b">
      <span class="tool-label">Толщина</span>
      <input type="range" id="width" min="1" max="20" value="4">
      <button class="tool" id="undo">↶ Отменить</button>
      <button class="tool" id="clearDraw">🗑 Рисунок</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="cancel">Отмена</button>
      <button class="btn-primary" id="save">💾 Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
/* ==================== IndexedDB ==================== */
const DB_NAME = 'lt-tactics-db';
const STORE = 'maps';
let dbPromise = null;

function getDB() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e.target.error);
    });
  }
  return dbPromise;
}
async function dbGetAll() {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(obj) {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(obj);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbDelete(id) {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
async function dbClear() {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

/* ==================== Состояние ==================== */
const $ = id => document.getElementById(id);
const modal = $('modal');
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const nameInput = $('mapName');
const fileInput = $('fileInput');

let allMaps = [];
let currentId = null;
let bgImage = null;
let paths = [];
let currentPath = null;
let isDrawing = false;
let tool = 'arrow';
let replacingBg = false;

/* ==================== Отрисовка ==================== */
function drawPath(c, p) {
  c.strokeStyle = p.color;
  c.fillStyle = p.color;
  c.lineWidth = p.width;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  if (p.type === 'arrow') {
    const [x1, y1] = p.from;
    const [x2, y2] = p.to;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    if (len < 2) return;
    const angle = Math.atan2(dy, dx);
    const headLen = Math.min(len * 0.5, Math.max(12, p.width * 4));
    const headAngle = Math.PI / 7;

    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.stroke();

    c.beginPath();
    c.moveTo(x2, y2);
    c.lineTo(x2 - headLen * Math.cos(angle - headAngle), y2 - headLen * Math.sin(angle - headAngle));
    c.lineTo(x2 - headLen * Math.cos(angle + headAngle), y2 - headLen * Math.sin(angle + headAngle));
    c.closePath();
    c.fill();
  } else if (p.type === 'line') {
    const [x1, y1] = p.from;
    const [x2, y2] = p.to;
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.stroke();
  } else if (p.type === 'pen') {
    const pts = p.points;
    if (!pts.length) return;
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    if (pts.length === 1) c.lineTo(pts[0][0] + 0.1, pts[0][1] + 0.1);
    c.stroke();
  }
}

function redraw() {
  if (!canvas.width || !canvas.height) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (bgImage) ctx.drawImage(bgImage, 0, 0);
  for (const p of paths) drawPath(ctx, p);
  if (currentPath) drawPath(ctx, currentPath);
}

/* ==================== Загрузка изображения ==================== */
function processImage(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const MAX = 2000;
        if (Math.max(width, height) > MAX) {
          const s = MAX / Math.max(width, height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        res({ dataURL: c.toDataURL('image/jpeg', 0.92), width, height });
      };
      img.onerror = () => rej(new Error('Не удалось прочитать изображение'));
      img.src = reader.result;
    };
    reader.onerror = () => rej(new Error('Ошибка чтения файла'));
    reader.readAsDataURL(file);
  });
}

function loadBg(dataURL) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      canvas.width = img.width;
      canvas.height = img.height;
      redraw();
      res();
    };
    img.onerror = () => rej(new Error('Не удалось загрузить фон'));
    img.src = dataURL;
  });
}

/* ==================== Редактор ==================== */
async function openEditor(mapData) {
  currentId = mapData.id || null;
  nameInput.value = mapData.name || '';
  paths = mapData.paths ? JSON.parse(JSON.stringify(mapData.paths)) : [];
  currentPath = null;
  isDrawing = false;
  await loadBg(mapData.bg);
  modal.classList.add('open');
}

function closeEditor() {
  modal.classList.remove('open');
  currentId = null;
  bgImage = null;
  paths = [];
  currentPath = null;
  isDrawing = false;
  nameInput.value = '';
  canvas.width = 0;
  canvas.height = 0;
}

function makeThumb() {
  const t = document.createElement('canvas');
  const scale = Math.min(1, 400 / canvas.width);
  t.width = Math.round(canvas.width * scale);
  t.height = Math.round(canvas.height * scale);
  const tc = t.getContext('2d');
  tc.drawImage(bgImage, 0, 0, t.width, t.height);
  tc.save();
  tc.scale(scale, scale);
  for (const p of paths) drawPath(tc, p);
  tc.restore();
  return t.toDataURL('image/jpeg', 0.82);
}

async function saveMap() {
  const name = nameInput.value.trim();
  if (!name) { alert('Введите название карты'); nameInput.focus(); return; }
  if (!bgImage) { alert('Нет изображения карты'); return; }

  const obj = {
    name,
    bg: bgImage.src,
    paths,
    thumb: makeThumb(),
    width: canvas.width,
    height: canvas.height,
    updatedAt: Date.now()
  };
  if (currentId) obj.id = currentId;
  else obj.createdAt = Date.now();

  try {
    currentId = await dbPut(obj);
    closeEditor();
    await loadMaps();
    toast('Сохранено');
  } catch (err) {
    alert('Ошибка сохранения: ' + err.message);
  }
}

/* ==================== Рисование ==================== */
function getPoint(e) {
  const r = canvas.getBoundingClientRect();
  return [
    (e.clientX - r.left) * (canvas.width / r.width),
    (e.clientY - r.top) * (canvas.height / r.height)
  ];
}

canvas.addEventListener('pointerdown', e => {
  if (!bgImage) return;
  e.preventDefault();
  isDrawing = true;
  canvas.setPointerCapture(e.pointerId);
  const pt = getPoint(e);
  const color = $('color').value;
  const width = parseInt($('width').value);
  if (tool === 'pen') {
    currentPath = { type: 'pen', points: [pt], color, width };
  } else {
    currentPath = { type: tool, from: pt, to: pt, color, width };
  }
  redraw();
});

canvas.addEventListener('pointermove', e => {
  if (!isDrawing || !currentPath) return;
  e.preventDefault();
  const pt = getPoint(e);
  if (tool === 'pen') currentPath.points.push(pt);
  else currentPath.to = pt;
  redraw();
});

function finishPath() {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentPath) {
    if (currentPath.type === 'pen') {
      if (currentPath.points.length > 1) paths.push(currentPath);
    } else {
      const d = Math.hypot(
        currentPath.to[0] - currentPath.from[0],
        currentPath.to[1] - currentPath.from[1]
      );
      if (d >= 4) paths.push(currentPath);
    }
    currentPath = null;
  }
  redraw();
}
canvas.addEventListener('pointerup', finishPath);
canvas.addEventListener('pointercancel', finishPath);

/* ==================== Сетка карт ==================== */
async function loadMaps() {
  try {
    allMaps = await dbGetAll();
    allMaps.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    renderGrid();
  } catch (err) {
    console.error(err);
    alert('Ошибка загрузки данных: ' + err.message);
  }
}

function renderGrid() {
  const query = $('search').value.trim().toLowerCase();
  const list = allMaps.filter(m => !query || m.name.toLowerCase().includes(query));
  const grid = $('grid');
  const empty = $('empty');
  grid.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = 'block';
    empty.innerHTML = allMaps.length === 0
      ? 'Карт пока нет.<br>Нажмите «+ Добавить карту», загрузите изображение и рисуйте тактику стрелками.<br><br><span style="font-size:13px">Все данные хранятся локально в вашем браузере.</span>'
      : `По запросу «${escapeHtml(query)}» ничего не найдено.`;
  } else {
    empty.style.display = 'none';
  }

  for (const m of list) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = m.thumb || m.bg;
    img.alt = m.name;
    const info = document.createElement('div');
    info.className = 'info';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = m.name;
    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '✕';
    delBtn.title = 'Удалить';
    info.append(nameEl, delBtn);
    card.append(img, info);

    card.addEventListener('click', () => openEditor(m));
    delBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`Удалить карту «${m.name}»?`)) return;
      await dbDelete(m.id);
      await loadMaps();
      toast('Удалено');
    });
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==================== UI события ==================== */
$('addBtn').onclick = () => { replacingBg = false; fileInput.click(); };
$('editOther').onclick = () => {
  if (paths.length > 0 && !confirm('При смене карты текущий рисунок будет удалён. Продолжить?')) return;
  replacingBg = true;
  fileInput.click();
};

fileInput.onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let dataURL;
  try {
    const r = await processImage(file);
    dataURL = r.dataURL;
  } catch (err) {
    alert('Ошибка: ' + err.message);
    replacingBg = false;
    return;
  }
  if (replacingBg) {
    replacingBg = false;
    paths = [];
    currentPath = null;
    await loadBg(dataURL);
  } else {
    try {
      await openEditor({ name: '', bg: dataURL, paths: [] });
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }
  }
};

$('search').addEventListener('input', renderGrid);
$('save').onclick = saveMap;
$('cancel').onclick = () => { if (confirm('Закрыть без сохранения?')) closeEditor(); };

$('undo').onclick = () => { if (paths.length) { paths.pop(); redraw(); } };
$('clearDraw').onclick = () => {
  if (!paths.length) return;
  if (!confirm('Удалить весь рисунок?')) return;
  paths = [];
  redraw();
};

document.querySelectorAll('.tool[data-tool]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
  };
});

$('clearCache').onclick = async () => {
  if (!confirm('Удалить ВСЕ сохранённые карты? Это действие необратимо.')) return;
  await dbClear();
  await loadMaps();
  toast('Кеш очищен');
};

/* ==================== Toast ==================== */
let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#30a46c;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;z-index:999;transition:opacity .3s;box-shadow:0 4px 20px rgba(0,0,0,.4);pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
}

/* ==================== Инициализация ==================== */
loadMaps();
</script>
</body>
</html>
